        function saveIMGVMLFile(_path, _imgVer, _from, _to) {
            var elems = [];
            var div = null;
            
            //find the main DIV element
            for (var i = 0; i < iDoc.body.childNodes.length && div == null; i++) {
                if (iDoc.body.childNodes[i].tagName == 'DIV')
                    div = iDoc.body.childNodes[i];
            }
            
            if (div == null) {
                alert('Invalid document! Main div not found.');
                return false;
            }
            
            //remove page-break-after
            div.style.pageBreakAfter = '';
        

            //get list of inputs and extensions
            var inputs = docUtils.getInputs(iDoc, false);
            var extensions = docUtils.getExtensions(iDoc);
            
            //remove all from document
            while (div.childNodes.length > 0) {
                div.removeChild(div.childNodes[0]);
            }
            
            //put the inputs and extensions back
            docUtils.appendElements(div, inputs);
            docUtils.appendElements(div, extensions);
            
            //put the image
            var img = iDoc.createElement('IMG');
            img.id = 'docBk';
            img.style.width = div.style.width;
            img.style.height = div.style.height;
            img.style.position = 'absolute';
            img.style.top = '0';
            img.style.left = '0';
            img.style.zIndex = -1;
            img.width = div.offsetWidth;
            img.height = div.offsetHeight;
            
            div.appendChild(img);
            if (_from == null) {
                img.src = 'etatfi-CERFA/' + _imgVer + '/' + document.title.replace(/(_0)?\.html/i, '.jpg');
                StoreImgDOC(_path + '\\' + document.title);
            }
            else {
                for (var i = _from; i <= _to; i++) {
                    imgName = 'etatfi-CERFA/' + _imgVer + '/' + document.title.replace(/(_0)?\.html/i, '');
                    img.src = imgName + '_' + i + '.jpg';
                    StoreImgDOC(_path + '\\' + document.title.replace(/(_[0-9])?\.html/i, '_' + i + '.html'));
                }
            }            
        }

        function saveIMGVML() {
            try {
                var args = new Object();
                args.range = new Object();
                args.imgVer = '';
                args.text = translate('Please enter image version: ');
                args.error = false;
                args.errorMsg = '';
                
                if (window.showModalDialog('input.html', args, 'scroll: no; status: no; dialogWidth: 200px; dialogHeight: 120px;')) {
                    if (args.error == false) {
                        var path = dirUtils.BrowseForFolder();
                        if (args.range.from != 0 && args.range.to != 0) {
                            if (args.range.from > args.range.to) {
                                alert('Invalid range!');
                                return false;
                            }
                            if (path != '') {
                                saveIMGVMLFile(path, args.imgVer, args.range.from, args.range.to);
                            }
                        }
                        else
                            saveIMGVMLFile(path, args.imgVer);
                    }
                    else {
                        alert('ERROR!\n' + args.errorMsg);
                        return false;
                    }
                }
            }
            catch (e) {
                alert('Error processing the document. Cannot save image-based version.');
                return false;
            }
            
            //SaveDocument(1);
        }
        
        function iFrLoaded() {
            iDoc = iFr.contentWindow.document;
            iDoc.onmousedown = Ribbon_handleClick;
            DoResize();
            
            if (iFr.src == '' || iFr.src == 'about:blank') return;
            ProcessDocument();
        }
        
        function ProcessDocument() {
            try {
                objEditor.setIFrame(iFr);
                
                var inputs = docUtils.getInputs(iDoc, true);
                var i;
                for (i = 0; i < inputs.length; i++) {
                    if (inputs[i].className != '')
                        inputs[i].className += ' input';
                    else
                        inputs[i].className = 'input';
                        
                    if (inputs[i].id.indexOf('*') > -1) {
                        //extension input. adding a position: absolute to the element's style
                        inputs[i].style.position = 'absolute';
                        
                        //setting position: relative to element's parent
                        var parent = inputs[i].parentElement;
                        while (parent != null && parent.tagName != 'TD') {
                            parent = parent.parentElement;
                        }
                        
                        if (parent != null) {
                            parent.style.position = 'relative';
                        }
                    }
                      
                    //assign mouse events
                    inputs[i].onmousedown = function() { inputMouseDown(this); };
                    inputs[i].onmouseup = function() { inputMouseUp(this); };
                    inputs[i].onmousemove = function() { inputMouseMove(this); };
                }
                
                /*//process extension's text
                var extensions = docUtils.getExtensions(iDoc);
                for (i = 0; i < extensions.length; i++) {
                    var spans = extensions[i].getElementsByTagName('SPAN');
                    for (var j = 0; j < spans.length; j++) {
                        //if (spans[j].className != '')
                        //    spans[j].className += ' input';
                        //else
                        //    spans[j].className = 'input';
                            
                            
                        //assign mouse events

                        spans[j].onmousemove = function() { inputMouseMove(this); };

                }*/
            }
            catch (e) {
            }
        }

        function DeleteInputs() {
            if (objEditor.selection.items.length > 0) {
                if (window.showModalDialog('confirmation.html', translate('Are you sure you want to delete the selected input(s)?'), 'scroll: no; status: no; dialogWidth: 350px; dialogHeight: 100px;') == "1") {
                    if (objEditor.resizer != null) {
                        objEditor.resizer.destructor();
                        objEditor.resizer = null;
                    }
                    
                    while (objEditor.selection.items.length > 0) {
                        objEditor.selection.items[0].elem.parentElement.removeChild(objEditor.selection.items[0].elem);
                        objEditor.selection.remove(objEditor.selection.items[0].elem);
                    }
                }
            }
        }
